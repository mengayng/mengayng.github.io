<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理财客户管理系统 - Ant Design 风格</title>
    <style>
        /* ================= Ant Design 基础变量与重置 ================= */
        :root {
            --primary-color: #1677ff;
            --primary-hover: #4096ff;
            --text-color: rgba(0, 0, 0, 0.88);
            --text-secondary: rgba(0, 0, 0, 0.65);
            --border-color: #d9d9d9;
            --bg-layout: #f5f5f5;
            --bg-container: #ffffff;
            --border-radius: 6px;
            --danger-color: #ff4d4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        }

        body {
            background-color: var(--bg-layout);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            font-size: 14px;
        }

        /* ================= 侧边栏 (Sider) ================= */
        .sider {
            width: 208px;
            background-color: #001529;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .logo {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            background-color: #002140;
        }

        .menu {
            list-style: none;
            padding: 8px 0;
        }

        .menu-item {
            padding: 0 16px 0 24px;
            height: 40px;
            line-height: 40px;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            margin: 4px 8px;
            border-radius: var(--border-radius);
            transition: all 0.3s;
        }

        .menu-item:hover {
            color: #fff;
        }

        .menu-item.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* ================= 主内容区 (Layout) ================= */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 (Header) */
        .header {
            height: 64px;
            background-color: var(--bg-container);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
        }

        .breadcrumb {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .user-info {
            color: var(--text-color);
            cursor: pointer;
        }

        /* 内容区 (Content) */
        .content {
            padding: 24px;
            overflow-y: auto;
        }

        .card {
            background: var(--bg-container);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        /* ================= 组件样式 ================= */

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }

        .toolbar-right {
            margin-left: auto;
        }

        /* 输入框 & 选择框 */
        .ant-input, .ant-select {
            height: 32px;
            padding: 4px 11px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            background: #fff;
        }

        .ant-input:hover, .ant-select:hover {
            border-color: var(--primary-hover);
        }

        .ant-input:focus, .ant-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);
        }

        /* 按钮 */
        .ant-btn {
            height: 32px;
            padding: 4px 15px;
            border-radius: var(--border-radius);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .ant-btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            box-shadow: 0 2px 0 rgba(5, 145, 255, 0.1);
        }

        .ant-btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .ant-btn-default {
            background-color: #fff;
            border-color: var(--border-color);
            color: var(--text-color);
        }

        .ant-btn-default:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .ant-btn-link {
            background: transparent;
            border: none;
            color: var(--primary-color);
            padding: 0 4px;
            height: auto;
        }
        
        .ant-btn-link.danger {
            color: var(--danger-color);
        }

        .ant-btn-link:hover {
            color: var(--primary-hover);
            background: transparent;
        }

        /* 表格 (Table) */
        .ant-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .ant-table th {
            background-color: #fafafa;
            color: var(--text-color);
            font-weight: 600;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .ant-table td {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            color: var(--text-color);
        }

        .ant-table tbody tr:hover td {
            background-color: #fafafa;
        }

        /* 标签 (Tag) */
        .ant-tag {
            display: inline-block;
            padding: 0 7px;
            font-size: 12px;
            line-height: 20px;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .ant-tag-red { color: #cf1322; background: #fff1f0; border-color: #ffa39e; }
        .ant-tag-gold { color: #d48806; background: #fffbe6; border-color: #ffe58f; }
        .ant-tag-green { color: #389e0d; background: #f6ffed; border-color: #b7eb8f; }

        /* 分页 (Pagination) */
        .ant-pagination {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
            gap: 8px;
        }

        .ant-pagination-item {
            min-width: 32px;
            height: 32px;
            line-height: 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: #fff;
            cursor: pointer;
            user-select: none;
        }

        .ant-pagination-item:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .ant-pagination-item.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }

        /* ================= 弹窗 (Modal) ================= */
        .ant-modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .ant-modal {
            background: #fff;
            width: 520px;
            border-radius: 8px;
            box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .ant-modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(5, 5, 5, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ant-modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
        }

        .ant-modal-close {
            color: rgba(0, 0, 0, 0.45);
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }

        .ant-modal-close:hover { color: var(--text-color); }

        .ant-modal-body {
            padding: 24px;
        }

        .ant-modal-footer {
            padding: 10px 16px;
            border-top: 1px solid rgba(5, 5, 5, 0.06);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* 表单项 (Form Item) */
        .ant-form-item {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
        }

        .ant-form-item-label {
            width: 90px;
            text-align: right;
            padding-right: 8px;
            color: var(--text-color);
        }

        .ant-form-item-control {
            flex: 1;
        }

        .ant-form-item-control .ant-input,
        .ant-form-item-control .ant-select {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 侧边栏 -->
    <aside class="sider">
        <div class="logo">理财客户系统</div>
        <ul class="menu">
            <li class="menu-item active">客户管理</li>
            <li class="menu-item">产品管理</li>
        </ul>
    </aside>

    <!-- 主布局 -->
    <div class="main">
        <!-- 顶栏 -->
        <header class="header">
            <div class="breadcrumb">首页 / 客户管理</div>
            <div class="user-info">👤 管理员</div>
        </header>

        <!-- 内容区 -->
        <main class="content">
            <div class="card">
                
                <!-- 工具栏 -->
                <div class="toolbar">
                    <input type="text" class="ant-input" placeholder="请输入客户姓名" style="width: 200px;">
                    <select class="ant-select" style="width: 150px;">
                        <option value="">全部风险评级</option>
                        <option value="1">保守型</option>
                        <option value="2">稳健型</option>
                        <option value="3">进取型</option>
                    </select>
                    <button class="ant-btn ant-btn-default">搜索</button>
                    
                    <div class="toolbar-right">
                        <button class="ant-btn ant-btn-primary" onclick="openModal()">+ 新增客户</button>
                    </div>
                </div>

                <!-- 表格 -->
                <table class="ant-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>客户姓名</th>
                            <th>手机号</th>
                            <th>风险评级</th>
                            <th>资产规模 (万)</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>张三</td>
                            <td>13800138000</td>
                            <td><span class="ant-tag ant-tag-red">进取型</span></td>
                            <td>500.00</td>
                            <td>
                                <button class="ant-btn ant-btn-link" onclick="openModal()">编辑</button>
                                <button class="ant-btn ant-btn-link danger">删除</button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>李四</td>
                            <td>13911112222</td>
                            <td><span class="ant-tag ant-tag-gold">稳健型</span></td>
                            <td>120.50</td>
                            <td>
                                <button class="ant-btn ant-btn-link" onclick="openModal()">编辑</button>
                                <button class="ant-btn ant-btn-link danger">删除</button>
                            </td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>王五</td>
                            <td>13733334444</td>
                            <td><span class="ant-tag ant-tag-green">保守型</span></td>
                            <td>50.00</td>
                            <td>
                                <button class="ant-btn ant-btn-link" onclick="openModal()">编辑</button>
                                <button class="ant-btn ant-btn-link danger">删除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分页 -->
                <div class="ant-pagination">
                    <div class="ant-pagination-item">&lt;</div>
                    <div class="ant-pagination-item active">1</div>
                    <div class="ant-pagination-item">2</div>
                    <div class="ant-pagination-item">&gt;</div>
                </div>

            </div>
        </main>
    </div>

    <!-- 弹窗 (Modal) -->
    <div class="ant-modal-mask" id="customerModal">
        <div class="ant-modal">
            <div class="ant-modal-header">
                <div class="ant-modal-title">新增客户</div>
                <span class="ant-modal-close" onclick="closeModal()">✕</span>
            </div>
            <div class="ant-modal-body">
                <div class="ant-form-item">
                    <label class="ant-form-item-label">客户姓名</label>
                    <div class="ant-form-item-control">
                        <input type="text" class="ant-input" placeholder="请输入姓名">
                    </div>
                </div>
                <div class="ant-form-item">
                    <label class="ant-form-item-label">手机号码</label>
                    <div class="ant-form-item-control">
                        <input type="text" class="ant-input" placeholder="请输入11位手机号">
                    </div>
                </div>
                <div class="ant-form-item">
                    <label class="ant-form-item-label">风险评级</label>
                    <div class="ant-form-item-control">
                        <select class="ant-select">
                            <option value="">请选择评级</option>
                            <option value="1">保守型</option>
                            <option value="2">稳健型</option>
                            <option value="3">进取型</option>
                        </select>
                    </div>
                </div>
                <div class="ant-form-item">
                    <label class="ant-form-item-label">资产规模</label>
                    <div class="ant-form-item-control">
                        <input type="number" class="ant-input" placeholder="请输入金额 (万元)">
                    </div>
                </div>
            </div>
            <div class="ant-modal-footer">
                <button class="ant-btn ant-btn-default" onclick="closeModal()">取消</button>
                <button class="ant-btn ant-btn-primary" onclick="alert('保存成功！(此处应请求后端接口)'); closeModal();">确定</button>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('customerModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customerModal').style.display = 'none';
        }
    </script>
</body>
</html>
